server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind nginx-proxy, keep redirects relative so they never carry this
    # container's own host/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Client-rendered routes (/stories/aluminum, /stories/graphics-card, …)
    # all load index.html; the app resolves the route itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing asset must 404, not return index.html as a fake model/script.
    location /assets/ {
        try_files $uri =404;
    }

    # Vite's hashed bundles never change under the same name.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Models keep stable names across builds, so revalidate rather than pin.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
    }

    location ~* \.(?:woff2|webp|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
