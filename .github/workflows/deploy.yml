name: Build and push image to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://storynarrative.j-web.ca

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # :sha-* gives an immutable tag for rollback; the stack pulls :latest.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/story-narrative:latest
            ${{ secrets.DOCKER_USERNAME }}/story-narrative:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
